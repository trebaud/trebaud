name: Update star counts

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Refresh star badges
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for repo in $(grep -oE 'github\.com/[^/"]+/[^/"]+/stargazers' README.md | cut -d/ -f2,3); do
            stars=$(gh api "repos/$repo" --jq .stargazers_count)
            sed -i -E "s#(github\.com/$repo/stargazers\"><img [^>]*badge/stars-)[0-9]+-#\1$stars-#" README.md
          done

      - name: Commit changes
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update star counts"
          git push
